name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, curl, mbstring
          coverage: none

      - name: Check syntax of every PHP file
        run: find private public_html tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit and end-to-end tests
        env:
          WEDDING_CONFIG: ${{ github.workspace }}/tests/config.php
          WEDDING_TEST_DB: ${{ runner.temp }}/e2e.sqlite
        run: |
          php -S localhost:8097 -t public_html tests/router.php > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          php tests/run.php --http=http://localhost:8097
