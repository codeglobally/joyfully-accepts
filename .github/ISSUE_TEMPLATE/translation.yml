name: Translation correction
description: Something in Spanish, German, French, Arabic, Chinese, Māori or Welsh reads wrongly, awkwardly or unkindly.
title: "Translation: "
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        Every language other than English started as a draft, so corrections from people who speak it are hugely welcome. Small fixes are just as useful as big ones.

        The wording lives in `private/lang/` (what guests see) and `private/lang/admin/` (the admin area), one file per language. You don't need to find the file: just tell us what you saw and what it should say.

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Español
        - Deutsch
        - Français
        - العربية (Arabic)
        - 简体中文 (Simplified Chinese)
        - 繁體中文 (Traditional Chinese)
        - Te Reo Māori
        - Cymraeg (Welsh)
        - English
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - Code entry page
        - Guest invitation page (RSVP, dietary, sections)
        - An email to guests (invitation or update)
        - Admin area
        - An email to admins
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What it says now
      description: Copy the text, or describe it if you can't.
    validations:
      required: true

  - type: textarea
    id: better
    attributes:
      label: What it should say
      description: If there's something in {curly brackets}, like {name} or {count}, please keep it exactly as it is; the site fills it in.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why (optional)
      description: For example, it's the wrong word, too formal, not how people say it where you live, or right-to-left text looks wrong.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I've left out guests' names, email addresses, invitation codes and anything else private (including in screenshots).
          required: true
