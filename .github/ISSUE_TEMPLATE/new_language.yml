name: New language request
description: Ask for the site to be offered in another language, or offer to help translate it.
title: "Language: "
labels: [translation, enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The site comes in English, Español, Deutsch, Français, العربية, 简体中文, 繁體中文 and Te Reo Māori. Adding a language means translating about 600 short phrases (the guest pages, emails and the admin area), plus checking dates and plural words work properly. A native speaker who can check the draft makes all the difference.

  - type: input
    id: language
    attributes:
      label: Which language?
      description: Its name in English and in the language itself, and the country or region if it matters (for example, Portuguese / Português, Brazil).
    validations:
      required: true

  - type: dropdown
    id: help
    attributes:
      label: Could you help?
      options:
        - I can translate it
        - I can check a draft translation
        - I'd like it, but can't help translate
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Who would it be for?
      description: For example, your guests, or couples where you live.

  - type: textarea
    id: notes
    attributes:
      label: Anything to know about the language?
      description: For example, it's written right to left, uses its own digits, has formal and informal "you", or has a particular way of writing dates or names.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I've left out guests' names, email addresses, invitation codes and anything else private.
          required: true
